name: Auto-Assign Issue Milestone

on:
  issues:
    types: [opened]

jobs:
  assign-milestone:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const body = context.payload.issue?.body || '';
            const lines = body.split(/\r?\n/).map(line => line.trim());

            const headingIndex = lines.findIndex(
              line => line.toLowerCase() === '### modpack/mod'
            );

            let mod = null;
            if (headingIndex !== -1) {
              for (let i = headingIndex + 1; i < lines.length; i++) {
                if (lines[i] !== '') {
                  mod = lines[i];
                  break;
                }
              }
            }

            if (!mod) {
              console.log('No mod found in issue body');
              return;
            }

            console.log(`Found mod: ${mod}`);

            const milestones = await github.rest.issues.listMilestones({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'all'
            });

            let milestone = milestones.data.find(m => m.title === mod);

            if (!milestone) {
              console.log(`Creating milestone: ${mod}`);
              const newMilestone = await github.rest.issues.createMilestone({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: mod
              });
              milestone = newMilestone.data;
            } else {
              console.log(`Milestone already exists: ${mod}`);
            }

            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              milestone: milestone.number
            });

            console.log(`Issue assigned to milestone: ${mod}`);
