name: Auto-Assign Milestone
on:
  issue_form:
    types: [submitted]

jobs:
  assign-milestone:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const mod = context.payload.inputs?.mod;
            if (!mod) {
              throw new Error('No mod input found');
            }

            console.log(`Found mod: ${mod}`);

            const milestones = await github.rest.issues.listMilestones({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'all'
            });

            let milestone = milestones.data.find(m => m.title === mod);
            if (!milestone) {
              const newMilestone = await github.rest.issues.createMilestone({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: mod
              });
              milestone = newMilestone.data;
            }

            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.issue.number,
              milestone: milestone.number
            });

            console.log(`Assigned issue #${context.payload.issue.number} to milestone ${mod}`);
