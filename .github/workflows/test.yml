name: Debug Issue Payload
on:
  workflow_dispatch:
  issues:
    types: [opened]

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            console.log('=== FULL CONTEXT PAYLOAD ===');
            console.log(JSON.stringify(context.payload, null, 2));

            if (context.payload.issue) {
              const body = context.payload.issue.body || '';

              console.log('\n=== ISSUE BODY ===');
              console.log(body);

              console.log('\n=== ISSUE OBJECT ===');
              console.log(JSON.stringify(context.issue, null, 2));
            } else {
              console.log('No issue context - triggered manually');
            }
